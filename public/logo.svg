<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 56" fill="none">
  <defs>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="awningLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Unified Brand Symbol (Stylized Boutique Bag & Awning Fusion) -->
  <g transform="translate(6, 5)">
    <!-- Arch Handle -->
    <path d="M14 15 C14 8 19 3 25 3 C31 3 36 8 36 15" stroke="url(#logoCyanGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Bag / Boutique Body -->
    <rect x="5" y="13" width="40" height="32" rx="8" fill="url(#logoCyanGrad)" filter="url(#badgeGlow)" />
    
    <!-- Awning Canopy on top part of the bag -->
    <path d="M5 23 C9 26 13 26 17 23 C21 26 25 26 29 23 C33 26 37 26 41 23 C43 24.5 45 23 45 23 L45 13 L5 13 Z" fill="url(#awningLight)" />
    
    <!-- Awning Vertical Accent Stripes -->
    <line x1="11" y1="13" x2="11" y2="24" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" />
    <line x1="23" y1="13" x2="23" y2="25" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" />
    <line x1="35" y1="13" x2="35" y2="24" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" />

    <!-- Smiling package curve -->
    <path d="M17 33 C20 37 30 37 33 33" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <circle cx="20" cy="30" r="1.5" fill="#FFFFFF" />
    <circle cx="30" cy="30" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography Brand Panel (Centered, Clean, Professional) -->
  <g transform="translate(62, 5)">
    <!-- Main Word: ПОРЪЧКИ — Perfectly centered in this panel at x=95 -->
    <text
      x="95"
      y="21"
      text-anchor="middle"
      font-family="'Unbounded', -apple-system, system-ui, sans-serif"
      font-weight="900"
      font-size="20.5"
      fill="#0F172A"
      letter-spacing="0.04em"
    >
      ПОРЪЧКИ
    </text>

    <!-- Subtitle Panel Capsule — Symmetrically enlarged and centered with colorful letters for МАЛКИ -->
    <g transform="translate(-1, 26)">
      <!-- Capsule pill background -->
      <rect
        x="0"
        y="0"
        width="192"
        height="22"
        rx="11"
        fill="#0284C7"
        fill-opacity="0.08"
        stroke="#0284C7"
        stroke-width="1.3"
        stroke-opacity="0.25"
      />
      
      <!-- Clean, modern text with colorful letters for МАЛКИ -->
      <text
        x="96"
        y="14.8"
        text-anchor="middle"
        font-family="'Onest', -apple-system, system-ui, sans-serif"
        font-weight="800"
        font-size="10"
        letter-spacing="1.2"
      >
        <tspan fill="#475569">ЗА </tspan>
        <tspan fill="#FF4D6D" font-weight="900">М</tspan>
        <tspan fill="#F59E0B" font-weight="900">А</tspan>
        <tspan fill="#10B981" font-weight="900">Л</tspan>
        <tspan fill="#06B6D4" font-weight="900">К</tspan>
        <tspan fill="#8B5CF6" font-weight="900">И</tspan>
        <tspan fill="#334155"> И ГОЛЕМИ</tspan>
      </text>
    </g>
  </g>
</svg>
