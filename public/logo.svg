  <!-- Typography -->
  <g transform="translate(68, 14)">
    <text x="0" y="20" font-family="'Unbounded', system-ui, sans-serif" font-weight="800" font-size="18" fill="#0F172A" letter-spacing="-0.3">
      ПОРЪЧКИ
    </text>
    <text x="0" y="38" font-family="'Onest', system-ui, sans-serif" font-weight="700" font-size="13" fill="#0891B2" letter-spacing="0.2">
      за малки и големи
    </text>
