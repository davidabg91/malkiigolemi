<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 54" fill="none">
  <defs>
    <linearGradient id="logoCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="awningLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Unified Brand Symbol (Stylized Boutique Bag & Awning Fusion) -->
  <g transform="translate(6, 4)">
    <!-- Arch Handle -->
    <path d="M14 15 C14 8 19 3 25 3 C31 3 36 8 36 15" stroke="url(#logoCyanGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Bag / Boutique Body -->
    <rect x="5" y="13" width="40" height="32" rx="8" fill="url(#logoCyanGrad)" filter="url(#badgeGlow)" />
    
    <!-- Awning Canopy on top part of the bag -->
    <path d="M5 23 C9 26 13 26 17 23 C21 26 25 26 29 23 C33 26 37 26 41 23 C43 24.5 45 23 45 23 L45 13 L5 13 Z" fill="url(#awningLight)" />
    
    <!-- Awning Vertical Accent Stripes -->
    <line x1="11" y1="13" x2="11" y2="24" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" />
    <line x1="23" y1="13" x2="23" y2="25" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" />
    <line x1="35" y1="13" x2="35" y2="24" stroke="#0284C7" stroke-width="1.8" stroke-linecap="round" />

    <!-- Smiling package curve (customer delight & family orders) -->
    <path d="M17 33 C20 37 30 37 33 33" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none" />
    <circle cx="20" cy="30" r="1.5" fill="#FFFFFF" />
    <circle cx="30" cy="30" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Typography Lockup (Integrated as ONE unit) -->
  <g transform="translate(60, 6)">
    <!-- Main Word: ПОРЪЧКИ -->
    <text x="0" y="21" font-family="'Unbounded', -apple-system, system-ui, sans-serif" font-weight="900" font-size="21.5" fill="#0F172A" letter-spacing="-0.3">
      ПОРЪЧКИ
    </text>

    <!-- Integrated Subtitle Capsule: ЗА МАЛКИ И ГОЛЕМИ -->
    <g transform="translate(0, 27)">
      <!-- Capsule background pill -->
      <rect x="0" y="0" width="198" height="17" rx="8.5" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.3" />
      
      <!-- Sparkle icon left -->
      <polygon points="12,5 13.5,8.5 17,10 13.5,11.5 12,15 10.5,11.5 7,10 10.5,8.5" fill="#0EA5E9" />
      
      <!-- Text -->
      <text x="105" y="12" text-anchor="middle" font-family="'Onest', -apple-system, system-ui, sans-serif" font-weight="800" font-size="9.5" fill="#0369A1" letter-spacing="1.2">
        ЗА МАЛКИ И ГОЛЕМИ
      </text>

      <!-- Sparkle icon right -->
      <polygon points="186,5 187.5,8.5 191,10 187.5,11.5 186,15 184.5,11.5 181,10 184.5,8.5" fill="#0EA5E9" />
    </g>
  </g>
</svg>
