<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0891b2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Plate -->
  <rect x="12" y="86" width="76" height="4" rx="2" fill="#0F172A" />

  <!-- Main Storefront Body -->
  <rect x="18" y="44" width="64" height="42" rx="5" fill="#F8FAFC" stroke="#0F172A" stroke-width="3" stroke-linejoin="round" />

  <!-- Shop Display Window -->
  <rect x="24" y="52" width="30" height="26" rx="4" fill="#E0F2FE" stroke="#0F172A" stroke-width="2.5" />
  <!-- Window Shelf & Reflections -->
  <path d="M26 56 L38 56" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  <circle cx="34" cy="67" r="4" fill="#06B6D4" opacity="0.85" />
  <rect x="41" y="63" width="7" height="9" rx="1.5" fill="#F59E0B" />
  <line x1="24" y1="68" x2="54" y2="68" stroke="#0F172A" stroke-width="1.5" opacity="0.3" stroke-dasharray="2 2" />

  <!-- Shop Entrance Door -->
  <rect x="58" y="52" width="18" height="34" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="2.5" />
  <!-- Door Glass Pane -->
  <rect x="62" y="56" width="10" height="13" rx="2" fill="#E0F2FE" stroke="#0F172A" stroke-width="1.5" />
  <!-- Door Handle -->
  <circle cx="63.5" cy="73.5" r="1.5" fill="#0F172A" />

  <!-- Canopy / Awning -->
  <!-- Awning base white -->
  <path d="M15 36 L85 36 L83 48 C83 50.5 80 51.5 77.5 49.5 C75 51.5 72 51.5 69.5 49.5 C67 51.5 64 51.5 61.5 49.5 C59 51.5 56 51.5 53.5 49.5 C51 51.5 48 51.5 45.5 49.5 C43 51.5 40 51.5 37.5 49.5 C35 51.5 32 51.5 29.5 49.5 C27 51.5 24 51.5 21.5 49.5 C19 51.5 16 50.5 16 48 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Stripes in Cyan/Teal -->
  <path d="M22 36 L29 36 L28.5 48 C27 50.5 23.5 50.5 22 48 Z" fill="url(#shopGrad)" stroke="#0F172A" stroke-width="1.5" />
  <path d="M36 36 L43 36 L42.5 48 C41 50.5 37.5 50.5 36 48 Z" fill="url(#shopGrad)" stroke="#0F172A" stroke-width="1.5" />
  <path d="M50 36 L57 36 L56.5 48 C55 50.5 51.5 50.5 50 48 Z" fill="url(#shopGrad)" stroke="#0F172A" stroke-width="1.5" />
  <path d="M64 36 L71 36 L70.5 48 C69 50.5 65.5 50.5 64 48 Z" fill="url(#shopGrad)" stroke="#0F172A" stroke-width="1.5" />
  <path d="M78 36 L84 36 L82.5 48 C81 50 78.5 49.5 78 48 Z" fill="url(#shopGrad)" stroke="#0F172A" stroke-width="1.5" />

  <!-- Top bar of canopy -->
  <path d="M13 36 L87 36" stroke="#0F172A" stroke-width="3" stroke-linecap="round" />

  <!-- Roof Sign Posts -->
  <line x1="39" y1="26" x2="39" y2="36" stroke="#0F172A" stroke-width="2.2" />
  <line x1="61" y1="26" x2="61" y2="36" stroke="#0F172A" stroke-width="2.2" />

  <!-- Roof Sign "SHOP" -->
  <rect x="31" y="14" width="38" height="15" rx="4" fill="url(#shopGrad)" stroke="#0F172A" stroke-width="2.5" />
  <text x="50" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" letter-spacing="1.2">SHOP</text>
</svg>
