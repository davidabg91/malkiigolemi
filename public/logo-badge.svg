<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="awningLight2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Deep Shadow for bottom banner -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>

    <filter id="plateShadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="400" height="400" rx="56" fill="url(#badgeBg)" />

  <!-- Subtle glow aura -->
  <circle cx="200" cy="150" r="130" fill="#FFFFFF" opacity="0.15" />

  <!-- Central Unified Emblem -->
  <g transform="translate(140, 50)">
    <!-- Arch handle -->
    <path d="M35 50 C35 20 50 8 60 8 C70 8 85 20 85 50" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" />
    
    <!-- Bag body with deep shadow -->
    <rect x="10" y="45" width="100" height="95" rx="22" fill="#FFFFFF" />
    <rect x="16" y="51" width="88" height="83" rx="18" fill="#F0F9FF" />
    
    <!-- Awning canopy on upper part of bag -->
    <path d="M16 80 C24 88 32 88 40 80 C48 88 56 88 64 80 C72 88 80 88 88 80 C96 88 104 88 104 80 L104 51 L16 51 Z" fill="url(#badgeBg)" />
    
    <!-- Stripes -->
    <line x1="32" y1="51" x2="32" y2="82" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="56" y1="51" x2="56" y2="84" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="80" y1="51" x2="80" y2="82" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />

    <!-- Cute smiling arc for family satisfaction -->
    <path d="M42 110 C50 122 70 122 78 110" stroke="#0284C7" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="48" cy="102" r="3.5" fill="#0284C7" />
    <circle cx="72" cy="102" r="3.5" fill="#0284C7" />
  </g>

  <!-- Unified Bottom Brand Plate -->
  <g filter="url(#plateShadow)">
    <rect x="28" y="225" width="344" height="135" rx="32" fill="#0F172A" />
    <rect x="32" y="229" width="336" height="127" rx="28" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  </g>

  <!-- Typography as part of the unified emblem -->
  <text x="200" y="278" text-anchor="middle" font-family="'Unbounded', -apple-system, system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="0.5">
    ПОРЪЧКИ
  </text>
  
  <!-- Capsule ribbon -->
  <rect x="62" y="298" width="276" height="34" rx="17" fill="#0284C7" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1.5" />
  
  <text x="200" y="321" text-anchor="middle" font-family="'Onest', -apple-system, system-ui, sans-serif" font-weight="800" font-size="14.5" fill="#38BDF8" letter-spacing="2">
    ЗА МАЛКИ И ГОЛЕМИ
  </text>
</svg>
