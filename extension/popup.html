<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <title>Поръчки от Facebook</title>
    <style>
      * { box-sizing: border-box; }
      body { width: 300px; margin: 0; padding: 16px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1c2526; background: #fff; }
      h1 { margin: 0 0 4px; font-size: 16px; }
      p { margin: 6px 0 0; color: #4a5759; }
      .state { font-weight: 600; color: #1f5c3f; }
      .state.off { color: #b3261e; }
      button, a.button { display: block; width: 100%; height: 40px; margin-top: 10px; padding: 0 14px; border: 0; border-radius: 999px; font: inherit; font-weight: 600; line-height: 40px; text-align: center; text-decoration: none; cursor: pointer; }
      .primary { background: #33484b; color: #fff; }
      .primary:hover { background: #26383a; }
      .ghost { background: #eef1f1; color: #1c2526; }
      .ghost:hover { background: #e1e6e6; }
      button:disabled { opacity: 0.55; cursor: default; }
      small { display: block; margin-top: 12px; color: #7b8687; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>Поръчки от Facebook</h1>
    <p id="state" class="state"></p>
    <p id="note"></p>
    <button id="all" class="primary" type="button" hidden>Събери от всички постове</button>
    <a id="admin" class="button ghost" target="_blank" rel="noopener" hidden>Отвори заявките в сайта</a>
    <a id="connect" class="button primary" target="_blank" rel="noopener" href="https://malkiigolemi.com/admin/facebook" hidden>Свържи със сайта</a>
    <small id="version"></small>
    <script src="popup.js"></script>
  </body>
</html>
